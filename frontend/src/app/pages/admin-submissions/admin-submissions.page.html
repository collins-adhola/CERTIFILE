<ion-content>
  <div style="padding: 16px; max-width: 1200px; margin: 0 auto">
    <h1 style="margin-bottom: 24px; color: #5c2d91">Submissions</h1>

    <!-- Loading State -->
    <div *ngIf="isLoading" style="text-align: center; padding: 48px">
      <ion-spinner name="crescent"></ion-spinner>
      <p style="margin-top: 16px; color: #64748b">Loading submissions...</p>
    </div>

    <!-- Error State -->
    <ion-card *ngIf="!isLoading && errorMessage && submissions.length === 0" color="danger">
      <ion-card-header>
        <ion-card-title>Error</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>{{ errorMessage }}</p>
      </ion-card-content>
    </ion-card>

    <!-- Empty State -->
    <ion-card *ngIf="!isLoading && !errorMessage && submissions.length === 0">
      <ion-card-content>
        <p style="text-align: center; color: #64748b; padding: 24px">
          No submissions found.
        </p>
      </ion-card-content>
    </ion-card>

    <!-- Submissions List -->
    <div *ngIf="!isLoading && submissions.length > 0">
      <ion-card *ngFor="let submission of submissions" style="margin-bottom: 16px">
        <ion-card-header>
          <ion-card-title style="font-size: 1.2rem; color: #5c2d91">
            {{ submission.fullName }}
          </ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <ion-item lines="none">
            <ion-label>
              <strong>Email:</strong> {{ submission.email }}
            </ion-label>
          </ion-item>
          <ion-item lines="none">
            <ion-label>
              <strong>Phone:</strong> {{ submission.phone }}
            </ion-label>
          </ion-item>
          <ion-item lines="none">
            <ion-label>
              <strong>Service/Topic:</strong> {{ submission.issuedBy }}
            </ion-label>
          </ion-item>
          <ion-item lines="none">
            <ion-label>
              <strong>Status:</strong>
              <span
                [style.color]="
                  submission.status === 'approved'
                    ? '#059669'
                    : submission.status === 'rejected'
                      ? '#dc2626'
                      : submission.status === 'in_review'
                        ? '#f59e0b'
                        : '#64748b'
                "
                style="text-transform: capitalize; margin-left: 8px"
              >
                {{ submission.status }}
              </span>
            </ion-label>
          </ion-item>
          <ion-item lines="none">
            <ion-label>
              <strong>Submitted:</strong> {{ submission.createdAt }}
            </ion-label>
          </ion-item>
        </ion-card-content>
      </ion-card>
    </div>
  </div>

  <!-- Error Toast -->
  <ion-toast
    [isOpen]="showErrorToast"
    [message]="errorMessage"
    duration="5000"
    color="danger"
    (didDismiss)="showErrorToast = false"
  >
  </ion-toast>
</ion-content>
