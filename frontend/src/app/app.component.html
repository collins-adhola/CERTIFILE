<ion-app>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <ion-header
    class="ion-no-border"
    style="
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: saturate(180%) blur(8px);
      background: rgba(255, 255, 255, 0.98);
      border-bottom: 1px solid var(--color-border);
    "
  >
    <ion-toolbar color="light">
      <div
        class="container"
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
          height: 56px;
        "
      >
        <!-- Mobile Hamburger Menu Button (Left) -->
        <button
          type="button"
          class="cf-mobile-menu-trigger"
          (click)="toggleMobileMenu($event)"
          aria-label="Toggle mobile navigation menu"
          aria-expanded="{{ mobileMenuOpen }}"
        >
          <ion-icon
            name="menu-outline"
            class="cf-hamburger-icon"
          ></ion-icon>
        </button>

        <!-- Logo (Next to Menu) -->
        <div class="cf-logo-wrapper">
          <a
            routerLink="/"
            class="cf-logo-link"
            aria-label="Go to CertiFile Compliance home page"
          >
            <div class="cf-logo-pill">
              CF
            </div>
            <strong>CertiFile Compliance</strong>
          </a>
        </div>

        <!-- Navigation (Center) -->
        <nav class="ion-hide-md-down" aria-label="Main navigation">
          <ion-buttons>
            <ion-button
              routerLink="/how"
              fill="clear"
              aria-label="Learn how our ID verification process works"
              >How it works</ion-button
            >
            <ion-button
              routerLink="/services"
              fill="clear"
              aria-label="View our compliance services"
              >Services</ion-button
            >
            <ion-button
              routerLink="/pricing"
              fill="clear"
              aria-label="View pricing plans"
              >Pricing</ion-button
            >
            <ion-button
              routerLink="/faq"
              fill="clear"
              aria-label="Read frequently asked questions"
              >FAQ</ion-button
            >
            <ion-button
              routerLink="/contact"
              fill="clear"
              aria-label="Contact us for support"
              >Contact</ion-button
            >
          </ion-buttons>
        </nav>

        <!-- Login Button (Far Right) -->
        <div class="cf-login-button-wrapper">
          <a
            routerLink="/login"
            class="cf-login-pill"
            aria-label="Sign in to your account"
          >
            Login
          </a>
        </div>
      </div>
    </ion-toolbar>
  </ion-header>

  <!-- Mobile Dropdown Menu (Outside header for proper positioning) -->
  <div
    class="cf-mobile-dropdown-backdrop"
    *ngIf="mobileMenuOpen"
    (click)="closeMobileMenu()"
  ></div>
  <div
    class="cf-mobile-dropdown"
    [class.cf-mobile-dropdown-open]="mobileMenuOpen"
  >
    <a
      routerLink="/"
      (click)="closeMobileMenu()"
      class="cf-mobile-nav-link"
    >
      Home
    </a>
    <a
      routerLink="/how"
      (click)="closeMobileMenu()"
      class="cf-mobile-nav-link"
    >
      How it works
    </a>
    <a
      routerLink="/services"
      (click)="closeMobileMenu()"
      class="cf-mobile-nav-link"
    >
      Services
    </a>
    <a
      routerLink="/pricing"
      (click)="closeMobileMenu()"
      class="cf-mobile-nav-link"
    >
      Pricing
    </a>
    <a
      routerLink="/faq"
      (click)="closeMobileMenu()"
      class="cf-mobile-nav-link"
    >
      FAQ
    </a>
    <a
      routerLink="/contact"
      (click)="closeMobileMenu()"
      class="cf-mobile-nav-link"
    >
      Contact
    </a>
    <a
      routerLink="/login"
      (click)="closeMobileMenu()"
      class="cf-mobile-nav-link cf-mobile-nav-link-signin"
    >
      Sign in
    </a>
  </div>

  <main id="main-content">
    <ion-router-outlet></ion-router-outlet>
  </main>

  <ion-footer
    style="border-top: 1px solid var(--color-border); background: #f8fafc"
  >
    <ion-toolbar color="light">
      <div
        class="container"
        style="
          display: flex;
          gap: 16px;
          align-items: center;
          justify-content: space-between;
          padding-block: 16px;
          flex-wrap: wrap;
        "
      >
        <div style="display: flex; flex-direction: column; gap: 8px">
          <small style="color: var(--color-muted)"
            >© {{ currentYear }} CertiFile Compliance. All rights
            reserved.</small
          >
          <div style="display: flex; gap: 16px; flex-wrap: wrap"></div>
        </div>
        <nav
          style="display: flex; gap: 16px; flex-wrap: wrap"
          aria-label="Legal links"
        >
          <a
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Read our terms of service"
            style="
              color: var(--color-muted);
              text-decoration: none;
              font-size: 14px;
            "
            >Terms</a
          >
          <a
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Read our privacy policy"
            style="
              color: var(--color-muted);
              text-decoration: none;
              font-size: 14px;
            "
            >Privacy</a
          >
          <a
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Read our cookie policy"
            style="
              color: var(--color-muted);
              text-decoration: none;
              font-size: 14px;
            "
            >Cookies</a
          >
          <a
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Read our data processing policy"
            style="
              color: var(--color-muted);
              text-decoration: none;
              font-size: 14px;
            "
            >Data Processing</a
          >
        </nav>
      </div>
    </ion-toolbar>
  </ion-footer>
</ion-app>
