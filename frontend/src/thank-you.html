<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Thank You - CertiFile Compliance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <script>
      // Wait a moment for any existing Angular app to initialize, then redirect
      setTimeout(function() {
        // Try to use Angular router if available, otherwise use location
        if (window.location.pathname !== '/thank-you') {
          window.location.href = '/thank-you';
        }
      }, 100);
      
      // Fallback: redirect immediately if Angular isn't detected
      if (!document.querySelector('app-root')) {
        window.location.replace('/thank-you');
      }
    </script>
    <meta http-equiv="refresh" content="1; url=/thank-you" />
  </head>
  <body>
    <div style="font-family: system-ui, -apple-system, sans-serif; padding: 2rem; text-align: center; max-width: 600px; margin: 4rem auto;">
      <h1 style="color: #5c2d91;">Thank you!</h1>
      <p>Your enquiry has been received.</p>
      <p>Redirecting to confirmation page...</p>
      <p><a href="/thank-you" style="color: #5c2d91; text-decoration: underline;">Click here if you are not redirected</a></p>
    </div>
  </body>
</html>
